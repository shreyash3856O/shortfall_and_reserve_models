<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDAS — Mine Intelligence & Data Analytics System (MOIL)</title>
    <meta name="description" content="Autonomous geological reserve estimation and production shortfall early-warning system for Manganese Ore India Limited." />
    <meta name="theme-color" content="#0B0D10" />
    <!-- Google Website Translator API -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement(
            { pageLanguage: 'en', autoDisplay: false },
            'google_translate_element'
          );
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
  </head>
  <body class="bg-[#0B0D10] text-[#E6EDF3] antialiased">
    <div id="google_translate_element" style="display:none; position:absolute; top:-9999px; left:-9999px;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
